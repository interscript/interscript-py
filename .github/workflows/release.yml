name: Release

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install build pytest
    - run: pip install -e .
    - run: pytest tests/ -v
    - run: python -m build
    - uses: pypa/gh-action-pypi-publish@release/v1
