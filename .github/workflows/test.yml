name: PyTest

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    name: PyTest (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: interscript/maps
        path: maps
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: pip install -e ".[dev]"
    - run: pytest tests/ -v
      env:
        INTERSCRIPT_MAPS_PATH: ${{ github.workspace }}/maps/maps

  conformance-matrix:
    name: Conformance matrix (frozen fixtures)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -e ".[dev]"
    - name: Download fixtures (GitHub Releases channel)
      run: |
        mkdir -p fixtures && cd fixtures
        BASE="https://github.com/interscript/interscript-models/releases/download"
        curl -fsSL -o models-index.yaml "$BASE/index-v12/models-index.yaml"
        curl -fsSL -o models-index.yaml.sha256 "$BASE/index-v12/models-index.yaml.sha256"
        echo "$(cat models-index.yaml.sha256)" | sha256sum -c
        for v in urd-diac-base fas-diac-base urd-g2p-base; do
          curl -fsSL -O "$BASE/index-v12/$v-vectors.json"
        done
        # the two single-zip models; urd-g2p (split parts) resolves
        # via the runtime resolver in a later matrix pass
        for m in urd-diac-base-1.0 fas-diac-base-1.0; do
          url=$(sed -n "/^  $m:/,/^  [a-z]/p" models-index.yaml | grep -m1 'url:' | awk '{print $2}')
          curl -fsSL -o "$m.zip" "$url"
        done
    - name: Run the matrix
      run: |
        for pair in "urd-diac-base-1.0 urd-diac-base" "fas-diac-base-1.0 fas-diac-base"; do
          set -- $pair
          echo "::group::$1"
          SECRYST_E2E_ZIP="$PWD/fixtures/$1.zip" \
            CONFORMANCE_VECTORS="$PWD/fixtures/$2-vectors.json" \
            pytest tests_ml/test_conformance.py -v
          echo "::endgroup::"
        done
